name: enma-pilot

services:
  postgres:
    image: postgres:18-alpine
    container_name: enma-pilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PILOT_POSTGRES_DB:?PILOT_POSTGRES_DB is required}
      POSTGRES_USER: ${PILOT_POSTGRES_USER:?PILOT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${PILOT_POSTGRES_PASSWORD:?PILOT_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${PILOT_POSTGRES_PORT:?PILOT_POSTGRES_PORT is required}:5432"
    volumes:
      - enma_pilot_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: enma-pilot-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${PILOT_MINIO_ROOT_USER:?PILOT_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${PILOT_MINIO_ROOT_PASSWORD:?PILOT_MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${PILOT_MINIO_API_PORT:?PILOT_MINIO_API_PORT is required}:9000"
      - "127.0.0.1:${PILOT_MINIO_CONSOLE_PORT:?PILOT_MINIO_CONSOLE_PORT is required}:9001"
    volumes:
      - enma_pilot_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: enma-pilot-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${PILOT_MINIO_ROOT_USER:?PILOT_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${PILOT_MINIO_ROOT_PASSWORD:?PILOT_MINIO_ROOT_PASSWORD is required}
      MINIO_APP_ACCESS_KEY: ${PILOT_MINIO_APP_ACCESS_KEY:?PILOT_MINIO_APP_ACCESS_KEY is required}
      MINIO_APP_SECRET_KEY: ${PILOT_MINIO_APP_SECRET_KEY:?PILOT_MINIO_APP_SECRET_KEY is required}
    volumes:
      - ./infrastructure/minio/enma-pilot-documents-app-policy.json:/policies/enma-pilot-documents-app-policy.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set pilot http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" --api S3v4 --path on
        mc mb --ignore-existing pilot/enma-pilot-documents
        mc anonymous set none pilot/enma-pilot-documents
        mc admin policy create pilot enma-pilot-documents-app /policies/enma-pilot-documents-app-policy.json
        mc admin user rm pilot "$$MINIO_APP_ACCESS_KEY" >/dev/null 2>&1 || true
        mc admin user add pilot "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY"
        mc admin policy attach pilot enma-pilot-documents-app --user "$$MINIO_APP_ACCESS_KEY"

  mailpit:
    image: axllent/mailpit:v1.30.7
    container_name: enma-pilot-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${PILOT_MAILPIT_SMTP_PORT:?PILOT_MAILPIT_SMTP_PORT is required}:1025"
      - "127.0.0.1:${PILOT_MAILPIT_UI_PORT:?PILOT_MAILPIT_UI_PORT is required}:8025"
    volumes:
      - enma_pilot_mailpit_data:/data

volumes:
  enma_pilot_postgres_data:
    name: enma_pilot_postgres_data
  enma_pilot_minio_data:
    name: enma_pilot_minio_data
  enma_pilot_mailpit_data:
    name: enma_pilot_mailpit_data
